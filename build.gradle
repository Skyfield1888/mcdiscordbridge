plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
    id 'com.gradleup.shadow' version '8.3.9'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven { url = 'https://maven.lavalink.dev/releases' }
    maven { url = 'https://maven.lavalink.dev/snapshots' }
    maven { url = 'https://m2.dv8tion.net/releases' }
    // Add Kyoko Maven for libdave native releases if not on Lavalink
    maven { url = 'https://maven.topi.wtf/releases' }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime

    shadedDiscord
}

dependencies {
    compileOnly "org.slf4j:slf4j-api:2.0.7"
    compileOnly "com.google.code.gson:gson:2.10.1"

    // Core Discord4J library
    shadedDiscord "com.discord4j:discord4j-core:3.3.3"

    // DAVE (Discord voice E2EE) native bindings — one artifact per target OS/arch
    shadedDiscord "moe.kyokobot.libdave:impl-jni:0.1.2"
    shadedDiscord "moe.kyokobot.libdave:natives-win-x86-64:0.1.2"
    shadedDiscord "moe.kyokobot.libdave:natives-linux-x86-64:0.1.2"

    // GIF decoding IMAGEIO
    shadedDiscord 'com.twelvemonkeys.imageio:imageio-webp:3.13.1'

    implementation "de.maxhenkel.voicechat:voicechat-api:2.6.0"
    implementation "de.maxhenkel.opus4j:opus4j:2.1.0"

    runtimeOnly "maven.modrinth:simple-voice-chat:neoforge-${voicechat_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

def shadedDiscordJar = tasks.register('shadedDiscordJar', ShadowJar) {
    group = 'shading'
    archiveClassifier.set('discord-shaded')
    configurations = [project.configurations.shadedDiscord]

    // Relocate Netty to avoid classpath conflicts with Minecraft/NeoForge
    relocate 'io.netty', 'com.skyfield.mcdiscordbridge.shaded.io.netty'

    dependencies {
        // Exclude native OS epoll/kqueue if you don't need low-level Linux/Mac netty transport
        exclude(dependency('io.netty:netty-transport-native-epoll'))
        exclude(dependency('io.netty:netty-transport-native-kqueue'))
        exclude(dependency('io.netty:netty-resolver-dns-native-macos'))
    }

    mergeServiceFiles()

    // EXCLUDE signatures and module-info to prevent Forge security / loader errors
    exclude 'module-info.class'
    exclude '**/module-info.class'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    manifest {
        attributes(
                'Automatic-Module-Name': 'com.skyfield.mcdiscordbridge.shaded.discordbot'
        )
    }
}

dependencies {
    add('implementation', files(shadedDiscordJar.get().archiveFile))
    add('additionalRuntimeClasspath', files(shadedDiscordJar.get().archiveFile))
    add('jarJar', files(shadedDiscordJar.get().archiveFile))
}

tasks.named('compileJava') {
    dependsOn shadedDiscordJar
}
